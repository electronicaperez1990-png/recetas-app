<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}App de Recetas{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('recetas.index') }}">🍲 App de Recetas</a></h1>
    <nav>
      <a href="{{ url_for('recetas.index') }}">Inicio</a>
      <a href="{{ url_for('recetas.nueva_receta') }}">+ Nueva receta</a>
    </nav>
  </header>

  {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% if mensajes %}
      <ul class="flashes">
        {% for categoria, mensaje in mensajes %}
          <li class="{{ categoria }}">{{ mensaje }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
